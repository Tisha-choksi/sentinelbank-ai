x-backend-build: &backend-build
  context: ./backend

# DATABASE_URL here deliberately overrides whatever's in the root .env --
# that file's DATABASE_URL points at the HOST port (127.0.0.1:5433) for
# local `uvicorn`/`alembic` runs outside Docker. Containers on this Compose
# network reach Postgres via the service name "db" on its internal port
# 5432 instead, so backend/migrate pin that URL explicitly rather than
# inheriting the host-oriented value.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env -- generate one with python -c "import secrets; print(secrets.token_urlsafe(48))"}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  # investigation/llm_client.py's default (127.0.0.1:11434) means "this
  # container itself" once containerized -- it can never reach a model
  # server running on the host that way. Ollama isn't containerized here
  # (model weights are large and host-installed in local dev), so this
  # points at the host via the special `host.docker.internal` DNS name
  # instead. Override OLLAMA_HOST in .env if Ollama runs somewhere else
  # (e.g. its own container, or a remote host).
  OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

services:
  db:
    image: postgres:16
    container_name: sentinelbank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - sentinelbank_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs the Alembic migrations to completion and exits. backend
  # waits on `service_completed_successfully` below so the API is never
  # considered ready against a schema that isn't there yet.
  migrate:
    build: *backend-build
    image: sentinelbank-backend:latest
    container_name: sentinelbank-migrate
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: *backend-build
    image: sentinelbank-backend:latest
    container_name: sentinelbank-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    # `host.docker.internal` resolves out of the box on Docker Desktop
    # (Windows/Mac); this makes it resolve on native Linux Docker Engine
    # too, where it otherwise doesn't exist.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Checks /health/database (not just /health): this is the readiness
      # gate the frontend waits on below, so it must prove the DB
      # connection actually works, not just that the process is alive.
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8000/health/database
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Must be reachable from the user's BROWSER, not from inside the
        # Compose network -- see the note in frontend/Dockerfile. Override
        # via the root .env if the API is published on a different
        # host/port than the default below.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: sentinelbank-frontend:latest
    container_name: sentinelbank-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sentinelbank_pgdata:
